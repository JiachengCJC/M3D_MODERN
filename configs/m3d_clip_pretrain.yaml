schema_version: 1
experiment_name: m3d-clip-modernized-a100

model:
  language_model_name_or_path: bert-base-uncased
  pretrained_model: null
  local_loss: false
  gather_loss: true
  in_channels: 1
  img_size: [32, 256, 256]
  patch_size: [4, 16, 16]
  hidden_size: 768
  mlp_dim: 3072
  num_layers: 12
  num_heads: 12
  pos_embed: perceptron
  dropout_rate: 0.0
  spatial_dims: 3
  max_text_len: 128
  vocab_size: 30522
  projection_dim: 768
  qkv_bias: false
  vision_attention_backend: sdpa
  require_flash_sdpa: true
  vision_activation_checkpoint_every_n_layers: 1
  text_gradient_checkpointing: true
  text_attention_implementation: sdpa
  text_pooling: cls
  # Use legacy_linear to reproduce published M3D-CLIP checkpoints exactly.
  # Use exponential for a completely new CLIP run.
  logit_scale_mode: legacy_linear
  logit_scale_init: 2.659260036932778
  logit_scale_max: 100.0
  normalize_eps: 1.0e-6
  freeze_vision_encoder: false
  freeze_language_encoder: false
  freeze_projection_layers: false

data:
  data_root: ../Data/data
  caption_json: ../Data/data/M3D_Cap_npy/M3D_Cap.json
  image_size: [32, 256, 256]
  max_text_length: 128
  per_device_batch_size: 8
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  seed: 42
  train_augment: true
  verify_intensity_range: true

training:
  epochs: 100
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.98]
  epsilon: 1.0e-8
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  log_every_steps: 10
  eval_every_steps: 1000
  save_every_steps: 1000
  keep_last_n: 2
  output_dir: ../outputs/m3d-clip-modernized-a100
  use_bf16: true
  allow_tf32: true
  fused_adamw: true
  local_loss: false
  gather_with_grad: true
  label_smoothing: 0.0
  seed: 42

distributed:
  strategy: ddp
  backend: nccl
  timeout_seconds: 1800
