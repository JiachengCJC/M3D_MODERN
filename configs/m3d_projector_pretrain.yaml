checkpoint:
  asynchronous: true
  export_safetensors_at_end: true
  format: distributed_checkpoint
  keep_last_n: 2
  output_dir: ../outputs/m3d-phi3-projector-pretrain-modernized-a100
  resume_from: null
  save_every_steps: 1000
  save_optimizer: true
  save_rng_state: true
  save_scheduler: true
data:
  dynamic_padding: true
  local_cache_root: null
  non_blocking_transfer: true
  num_workers: 16
  pad_to_multiple_of: 8
  paths:
    caption_json: M3D_Cap_npy/M3D_Cap.json
    data_root: ../Data/data
    referring_segmentation_test_csv: M3D_RefSeg_npy/M3D_RefSeg_test.csv
    referring_segmentation_train_csv: M3D_RefSeg_npy/M3D_RefSeg.csv
    segmentation_root: M3D_Seg_npy
    vqa_test_csv: M3D-VQA/M3D_VQA_test.csv
    vqa_train_csv: M3D-VQA/M3D_VQA_train.csv
    vqa_val_csv: M3D-VQA/M3D_VQA_val.csv
    vqa_yes_no_train_csv: M3D-VQA/M3D_VQA_yn_train.csv
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 4
  pretokenize_text: true
  sequence_length_buckets:
  - 128
  - 256
  - 384
  - 512
  task_sampling:
    enabled: true
    homogeneous_batches: true
    steps_per_epoch: null
    task_weights:
      caption: 1.0
      vqa_closed: 0.0
      vqa_open: 0.0
      vqa_yes_no: 0.0
      positioning: 0.0
      segmentation: 0.0
    temperature_alpha: 0.5
  verify_files_at_startup: true
distributed:
  backend: nccl
  ddp:
    bucket_cap_mb: 25
    find_unused_parameters: true
    gradient_as_bucket_view: true
    static_graph: false
  fsdp2:
    cpu_offload: false
    mixed_precision: bf16
    reshard_after_forward: true
    wrap_language_layers: true
    wrap_main_vision_layers: true
    wrap_seg_vision_layers: true
    wrap_segmentation_decoder_layers: true
  strategy: ddp
  timeout_seconds: 1800
experiment_name: m3d-phi3-projector-pretrain-modernized-a100
logging:
  log_every_steps: 10
  log_gpu_memory: true
  profile_steps: []
  report_to:
  - tensorboard
  tensorboard_dir: ../logs/tensorboard/m3d-phi3-projector-pretrain-modernized-a100
model:
  box_end_token: <bx_end>
  box_start_token: <bx_start>
  image_token: <im_patch>
  language_model_family: phi3
  language_model_name_or_path: microsoft/Phi-3-mini-4k-instruct
  lora:
    adapter_checkpoint_path: null
    alpha: 32
    bias: none
    dropout: 0.05
    enabled: false
    rank: 16
    target_modules:
    - qkv_proj
    - o_proj
    - gate_up_proj
    - down_proj
  main_vision:
    activation_checkpoint_every_n_layers: 1
    architecture: vit3d
    attention_backend: sdpa
    checkpoint_path: ../LaMed/pretrained_model/M3D-CLIP/pretrained_ViT.bin
    depth: 12
    dropout: 0.0
    enabled: true
    freeze: true
    hidden_size: 768
    image_channels: 1
    image_size:
    - 32
    - 256
    - 256
    mlp_dim: 3072
    num_heads: 12
    patch_size:
    - 4
    - 16
    - 16
    qkv_bias: false
    require_flash_sdpa: true
    unfreeze_last_n_layers: 0
    use_cls_token: true
  model_max_length: 512
  projector:
    checkpoint_path: null
    freeze: false
    layer_type: mlp
    num_layers: 2
    pooling_size: 2
    pooling_type: spatial
    projector_type: spatial_pooling
  seg_vision:
    activation_checkpoint_every_n_layers: 1
    architecture: vit3d
    attention_backend: sdpa
    checkpoint_path: null
    depth: 12
    dropout: 0.0
    enabled: false
    freeze: false
    hidden_size: 768
    image_channels: 1
    image_size:
    - 32
    - 256
    - 256
    mlp_dim: 3072
    num_heads: 12
    patch_size:
    - 4
    - 16
    - 16
    qkv_bias: false
    require_flash_sdpa: true
    unfreeze_last_n_layers: 0
    use_cls_token: false
  segmentation:
    architecture: segvol
    bce_loss_weight: 1.0
    checkpoint_path: ../LaMed/pretrained_model/SegVol/pytorch_model.bin
    decoder_depth: 2
    decoder_heads: 8
    dice_loss_weight: 1.0
    enabled: false
    freeze_mask_decoder: false
    freeze_prompt_encoder: false
    prompt_embed_dim: 768
  segmentation_token: '[SEG]'
  tokenizer_name_or_path: null
  trust_remote_code: true
optimization:
  allow_tf32: true
  betas:
  - 0.9
  - 0.999
  checkpoint_language_model: true
  checkpoint_main_vision: true
  checkpoint_seg_vision: true
  checkpoint_segmentation_decoder: false
  compile_mode: default
  compile_model: false
  epochs: 1.0
  epsilon: 1.0e-08
  gradient_accumulation_steps: 8
  learning_rates:
    language_model: 0.0
    main_vision: 0.0
    projector: 0.001
    seg_vision: 0.0
    segmentation_decoder: 0.0
    segmentation_projector: 0.0
    token_embeddings: 0.001
  matmul_precision: high
  max_grad_norm: 1.0
  optimizer: adamw_fused
  per_device_batch_size: 1
  precision: bf16
  scheduler: cosine
  stage: projector_pretrain
  warmup_ratio: 0.03
  weight_decay: 0.0
runtime:
  detect_anomaly: false
  deterministic: false
  fail_on_nondeterministic_ops: false
  seed: 42
schema_version: 1
