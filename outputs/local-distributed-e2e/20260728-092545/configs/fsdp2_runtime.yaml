schema_version: 1
experiment_name: m3d-local-e2e-fsdp2
model:
  language_model_name_or_path: /Users/jiacheng/Documents/GitHub/M3D_MODERN/outputs/local-distributed-e2e/20260728-092545/fixtures/tiny-phi3
  tokenizer_name_or_path: /Users/jiacheng/Documents/GitHub/M3D_MODERN/outputs/local-distributed-e2e/20260728-092545/fixtures/tiny-phi3
  language_model_family: phi3
  trust_remote_code: false
  model_max_length: 64
  image_token: <im_patch>
  segmentation_token: '[SEG]'
  box_start_token: <bx_start>
  box_end_token: <bx_end>
  main_vision:
    enabled: true
    architecture: vit3d
    checkpoint_path: null
    image_channels: 1
    image_size:
    - 8
    - 16
    - 16
    patch_size:
    - 4
    - 8
    - 8
    hidden_size: 32
    depth: 2
    num_heads: 4
    mlp_dim: 64
    dropout: 0.0
    qkv_bias: false
    use_cls_token: true
    attention_backend: math
    require_flash_sdpa: false
    activation_checkpoint_every_n_layers: 0
    freeze: false
    unfreeze_last_n_layers: 0
  seg_vision:
    enabled: true
    architecture: vit3d
    checkpoint_path: null
    image_channels: 1
    image_size:
    - 8
    - 16
    - 16
    patch_size:
    - 4
    - 8
    - 8
    hidden_size: 32
    depth: 2
    num_heads: 4
    mlp_dim: 64
    dropout: 0.0
    qkv_bias: false
    use_cls_token: false
    attention_backend: math
    require_flash_sdpa: false
    activation_checkpoint_every_n_layers: 0
    freeze: false
    unfreeze_last_n_layers: 0
  projector:
    projector_type: spatial_pooling
    layer_type: mlp
    num_layers: 2
    pooling_type: spatial
    pooling_size: 2
