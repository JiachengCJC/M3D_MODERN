    freeze: false
  segmentation:
    enabled: true
    architecture: segvol
    checkpoint_path: null
    prompt_embed_dim: 32
    decoder_depth: 2
    decoder_heads: 4
    dice_loss_weight: 1.0
    bce_loss_weight: 1.0
    freeze_prompt_encoder: false
    freeze_mask_decoder: false
  lora:
    enabled: true
    rank: 4
    alpha: 8
    dropout: 0.0
    bias: none
    target_modules:
    - qkv_proj
    - o_proj
    - gate_up_proj
    - down_proj
    adapter_checkpoint_path: null
data:
  paths:
    data_root: /Users/jiacheng/Documents/GitHub/M3D_MODERN/outputs/local-distributed-e2e/20260728-092545/fixtures/data
    caption_json: M3D_Cap_npy/M3D_Cap.json
    vqa_train_csv: M3D-VQA/M3D_VQA_train.csv
    vqa_val_csv: M3D-VQA/M3D_VQA_val.csv
    vqa_test_csv: M3D-VQA/M3D_VQA_test.csv
    vqa_yes_no_train_csv: M3D-VQA/M3D_VQA_yn_train.csv
    segmentation_root: M3D_Seg_npy
    referring_segmentation_train_csv: M3D_RefSeg_npy/M3D_RefSeg.csv
    referring_segmentation_test_csv: M3D_RefSeg_npy/M3D_RefSeg_test.csv
  task_sampling:
    enabled: true
    homogeneous_batches: true
    temperature_alpha: 0.5
    steps_per_epoch: 2
    task_weights:
      caption: 1.0
      vqa_closed: 0.0
      vqa_open: 0.0
      vqa_yes_no: 0.0
      positioning: 0.0
      segmentation: 1.0
  dynamic_padding: true
  pad_to_multiple_of: 8
  sequence_length_buckets:
  - 32
  - 64
  pretokenize_text: true
  num_workers: 0
  persistent_workers: false
  pin_memory: false
  prefetch_factor: 1
  non_blocking_transfer: false
  local_cache_root: null
  verify_files_at_startup: true
optimization:
  stage: joint_finetune
  epochs: 1.0
  per_device_batch_size: 1
  gradient_accumulation_steps: 1
  precision: bf16
  allow_tf32: false
  matmul_precision: highest
  optimizer: adamw_fused
  learning_rates:
    language_model: 1.0e-05
    main_vision: 5.0e-06
    seg_vision: 5.0e-06
    projector: 5.0e-05
    segmentation_projector: 5.0e-05
    segmentation_decoder: 1.0e-05
    token_embeddings: 5.0e-05
  betas:
  - 0.9
  - 0.999
  epsilon: 1.0e-08
  weight_decay: 0.0
  max_grad_norm: 1.0
  scheduler: cosine
  warmup_ratio: 0.0
  checkpoint_language_model: false
  checkpoint_main_vision: false
  checkpoint_seg_vision: false
  checkpoint_segmentation_decoder: false
  compile_model: false
  compile_mode: default
distributed:
  strategy: fsdp2
  backend: gloo
  timeout_seconds: 300
  ddp:
    find_unused_parameters: true
    gradient_as_bucket_view: true
    static_graph: false
    bucket_cap_mb: 25
  fsdp2:
    reshard_after_forward: true
    cpu_offload: false
    mixed_precision: bf16
    wrap_language_layers: true
    wrap_main_vision_layers: true
    wrap_seg_vision_layers: true
    wrap_segmentation_decoder_layers: true
checkpoint:
  output_dir: /Users/jiacheng/Documents/GitHub/M3D_MODERN/outputs/local-distributed-e2e/20260728-092545/fsdp2_runtime
  resume_from: null
  save_every_steps: 1
  keep_last_n: 2
  save_optimizer: true
  save_scheduler: true
  save_rng_state: true
  asynchronous: false
  format: distributed_checkpoint
  export_safetensors_at_end: false
logging:
  log_every_steps: 1
  report_to: []
  tensorboard_dir: /Users/jiacheng/Documents/GitHub/M3D_MODERN/outputs/local-distributed-e2e/20260728-092545/fsdp2_runtime/tensorboard
  profile_steps: []
  log_gpu_memory: false
runtime:
  seed: 1729
  deterministic: true
  fail_on_nondeterministic_ops: false
  detect_anomaly: false
